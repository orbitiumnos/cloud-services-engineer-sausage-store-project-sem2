apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init-reports
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "10"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-client
          image: mongo:5.0 #{{ .Values.mongodb.image }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: mongodb-conf
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: mongodb-conf
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: REPORTS_DB
              value: {{ .Values.mongodb.reports.database }}
            - name: REPORTS_USER
              value: {{ .Values.mongodb.reports.user }}
            - name: REPORTS_PASSWORD
              value: {{ .Values.mongodb.reports.password }}
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          command:
            - /bin/bash
            - -c
            - |
              mongo --host mongodb -u "$MONGO_ROOT_USER" -p "$MONGO_ROOT_PASSWORD" --authenticationDatabase admin sausage-store --eval "
                if (db.getUser(\"$MONGO_APP_USER\") == null) {
                  db.createUser({user: \"$MONGO_APP_USER\", pwd: \"$MONGO_APP_PASSWORD\", roles: [{ role: \"readWrite\", db: \"sausage-store\" }]});
                  print(\"user created\");
                } else {
                  db.updateUser(\"$MONGO_APP_USER\", {pwd: \"$MONGO_APP_PASSWORD\", roles: [{ role: \"readWrite\", db: \"sausage-store\" }]});
                  print(\"user already exists, updated\");
                }
              "


